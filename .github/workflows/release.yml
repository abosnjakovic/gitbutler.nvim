name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto detects from conventional commits)'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set." \
                 "Add a fine-grained PAT (Contents: read+write) as repository secret RELEASE_TOKEN." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'Adam Bosnjakovic'
          git config user.email 'adam@adimension.io'

      - name: Compute next version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(cat version.txt)
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)

          if [ "$BUMP_INPUT" = "auto" ]; then
            bump="none"
            while IFS= read -r line; do
              case "$line" in
                *"BREAKING CHANGE"*|*"!:"*)          bump="major" ;;
                feat:*|feat\(*\):*)                  [ "$bump" != "major" ] && bump="minor" ;;
                fix:*|fix\(*\):*|perf:*|perf\(*\):*) [ "$bump" = "none" ] && bump="patch" ;;
              esac
            done < <(git log "${prev_tag}..HEAD" --pretty=tformat:"%s" --no-merges)
          else
            bump="$BUMP_INPUT"
          fi

          if [ "$bump" = "none" ]; then
            echo "::notice::No feat/fix/perf commits since ${prev_tag}; falling back to patch bump."
            bump="patch"
          fi

          IFS='.' read -r major minor patch <<< "$current"
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
          esac

          echo "current=${current}"   >> "$GITHUB_OUTPUT"
          echo "next=${next}"         >> "$GITHUB_OUTPUT"
          echo "prev_tag=${prev_tag}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}"         >> "$GITHUB_OUTPUT"

      - name: Build changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.next }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          section=$(mktemp)

          {
            echo "## [${VERSION}] - ${today}"
            echo

            features=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" | grep -E '^- feat(\(.+\))?!?: ' || true)
            fixes=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" | grep -E '^- fix(\(.+\))?!?: ' || true)
            perf=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" | grep -E '^- perf(\(.+\))?!?: ' || true)
            # Everything else (test/style/docs/refactor/chore/...), minus the release commits themselves.
            other=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" | grep -vE '^- (feat|fix|perf)(\(.+\))?!?: |^- chore\(release\): ' || true)

            if [ -n "$features" ]; then
              echo "### Features"
              echo
              echo "$features"
              echo
            fi
            if [ -n "$fixes" ]; then
              echo "### Bug Fixes"
              echo
              echo "$fixes"
              echo
            fi
            if [ -n "$perf" ]; then
              echo "### Performance"
              echo
              echo "$perf"
              echo
            fi
            if [ -n "$other" ]; then
              echo "### Other"
              echo
              echo "$other"
              echo
            fi
          } > "$section"

          if [ -f CHANGELOG.md ]; then
            cat "$section" CHANGELOG.md > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          else
            cp "$section" CHANGELOG.md
          fi

          {
            echo "body<<RELEASE_EOF"
            cat "$section"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write version.txt
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: echo "$VERSION" > version.txt

      - name: Commit, tag, push
        env:
          VERSION: ${{ steps.version.outputs.next }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::v${VERSION} is already tagged on origin." \
                 "Nothing was pushed; check whether an earlier run half-completed." >&2
            exit 1
          fi
          git add version.txt CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          # One push for both refs. A tag rejection used to leave the bump on
          # the branch with no tag and no release behind it, which the next
          # run then bumps again from. --atomic means a failure pushes nothing
          # and the run can simply be dispatched again. The retry is for the
          # bare "[remote rejected] (failed)" GitHub answered once with no
          # reason, while the branch push seconds earlier had succeeded.
          for attempt in 1 2 3; do
            if git push --atomic origin "HEAD:${BRANCH}" "v${VERSION}"; then
              exit 0
            fi
            echo "::warning::push attempt ${attempt} failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::could not push v${VERSION}; nothing was published." >&2
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "${BODY}"
